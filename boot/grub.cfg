# GRUB menu of the GATE16 boot CD (used for both legacy BIOS and UEFI)
set default=0
set timeout=5
set timeout_style=menu

if [ "$grub_platform" = "efi" ]; then
	# UEFI has no text mode: ask for a moderate resolution so the
	# 80x25 editor stays readable on large monitors.
	set g16_video=1024x768,800x600,auto
else
	set g16_video=text
fi
export g16_video

menuentry "GATE16 Logic Gate Editor" {
	set gfxpayload=$g16_video
	echo "Loading GATE16 ..."
	linux /boot/vmlinuz quiet loglevel=3 consoleblank=0
	initrd /boot/initrd.img
}

menuentry "GATE16 - safe graphics (use if the screen stays black)" {
	if [ "$grub_platform" = "efi" ]; then set gfxpayload=keep; else set gfxpayload=text; fi
	echo "Loading GATE16 (safe graphics) ..."
	linux /boot/vmlinuz nomodeset loglevel=4 consoleblank=0 gate16.debug
	initrd /boot/initrd.img
}

menuentry "GATE16 - Linux shell first (troubleshooting)" {
	set gfxpayload=$g16_video
	linux /boot/vmlinuz loglevel=4 consoleblank=0 gate16.debug gate16.shell
	initrd /boot/initrd.img
}

if [ "$grub_platform" = "efi" ]; then
	menuentry "UEFI firmware settings (BIOS setup)" {
		fwsetup
	}
fi

menuentry "Reboot" {
	reboot
}

menuentry "Power off" {
	halt
}
