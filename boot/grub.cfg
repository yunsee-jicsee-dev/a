# GRUB menu of the GATE16 boot CD (used for both legacy BIOS and UEFI)
# Find the disc itself: depending on the firmware GRUB may start with its
# root on the small EFI partition, which has no kernel on it.
search --no-floppy --file --set=root /boot/vmlinuz

set default=0
set timeout=5
set timeout_style=menu

if [ "$grub_platform" = "efi" ]; then
	# UEFI has no text mode: ask for a moderate resolution so the
	# 80x25 editor stays readable on large monitors.
	set g16_video=1024x768,800x600,auto
else
	# a VESA framebuffer for the graphical board; text mode if none works
	set g16_video=1024x768x32,1024x768,800x600x32,800x600,text
fi
export g16_video

menuentry "GATE16 Logic Gate Editor" {
	set gfxpayload=$g16_video
	echo "Loading GATE16 ..."
	linux /boot/vmlinuz quiet loglevel=3 consoleblank=0
	initrd /boot/initrd.img
}

menuentry "GATE16 - classic text mode / safe graphics" {
	if [ "$grub_platform" = "efi" ]; then set gfxpayload=keep; else set gfxpayload=text; fi
	echo "Loading GATE16 (safe graphics) ..."
	linux /boot/vmlinuz nomodeset loglevel=4 consoleblank=0 gate16.debug gate16.tui
	initrd /boot/initrd.img
}

menuentry "GATE16 - Linux shell first (troubleshooting)" {
	set gfxpayload=$g16_video
	linux /boot/vmlinuz loglevel=4 consoleblank=0 gate16.debug gate16.shell
	initrd /boot/initrd.img
}

if [ "$grub_platform" = "efi" ]; then
	menuentry "UEFI firmware settings (BIOS setup)" {
		fwsetup
	}
fi

menuentry "Reboot" {
	reboot
}

menuentry "Power off" {
	halt
}
